# Las migraciones del esquema. La fuente de verdad es plataforma/modelo.py.
#
#   ./.venv/bin/python -m alembic upgrade head      # aplica las migraciones pendientes
#   ./.venv/bin/python -m alembic revision --autogenerate -m "lo que cambió"
#
# La URL de la base viene del entorno (DECOPET_DATABASE_URL o DATABASE_URL), nunca de acá:
# es un secreto y no va en el historial.
[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

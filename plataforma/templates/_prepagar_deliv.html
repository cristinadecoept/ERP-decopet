{# El cliente paga ahora los deliveries de las próximas entregas de un pack que ya existe (ficha del cliente) #}
{% macro prepagar_deliv(k, libres, volver) %}<details class="cobro cobro-izq" style="margin-top:4px;display:block"><summary class="no-link" style="font-size:12.5px">Prepagar deliveries</summary><form method="post" action="/packs/{{ k.id }}/prepagar-deliveries" class="cobro-f" style="min-width:250px"><input type="hidden" name="volver" value="{{ volver }}">
<div class="g2"><div><label style="margin-top:0">¿Cuántos?</label><select name="cuantos">{% for n in range(1, libres + 1) %}<option value="{{ n }}" {{ 'selected' if n == libres }}>{{ n }}</option>{% endfor %}</select></div><div><label style="margin-top:0">Delivery c/u USD</label><input type="number" step="0.01" min="0.01" name="tarifa" value="{{ '%g'|format(k.tarifa_prepagada or k.delivery_orden or 5) }}" required></div></div>
<label>Pagado con</label><select name="forma" required><option value="" selected disabled>Elegir…</option>{% for x in FORMAS_COBRO %}<option value="{{ x }}">{{ x|caja }}</option>{% endfor %}</select><label>Fecha</label><input type="date" name="fecha" value="{{ hoy }}"><p style="margin:8px 0 0"><button class="btn chico">Guardar</button></p></form></details>{% endmacro %}

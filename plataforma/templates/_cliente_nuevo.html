{% from "_lugar.html" import lugar %}<div class="pt"><h2>Nuevo cliente</h2></div>
<form method="post" action="/clientes/nuevo">
<div class="bloque"><h3>Datos</h3>
<div class="g2"><div><label>Nombre</label><input name="nombre_pila" required autofocus placeholder="María"></div><div><label>Apellido</label><input name="apellido" placeholder="Pérez"></div></div>
<div class="g2"><div><label>Teléfono <span class="obl">*</span></label><input name="telefono" placeholder="0414-1234567" inputmode="tel" required></div><div><label>Cédula / RIF</label><input name="cedula" placeholder="V-12345678"></div></div>
<label>Correo <span class="obl">*</span></label><input name="correo" inputmode="email" placeholder="nombre@gmail.com" required>
</div>
<div class="bloque">
{{ lugar(ciudades_vl) }}
<label>Dirección escrita (habitual)</label><input name="direccion" placeholder="Res., edificio, apto, referencia"><label>GPS <span class="mini">(link de Google Maps)</span></label><input name="maps" placeholder="https://maps.app.goo.gl/…" inputmode="url">
<label>¿Cómo llegó?</label><select name="origen" id="cl-origen" onchange="setOrigen(this)"><option value="">—</option><option>Publicidad (anuncio)</option><option>Recomendación de otro cliente</option></select>
<div id="ref-w" hidden><label>¿Quién lo recomendó?</label><input list="ref-cl" id="ref-in" placeholder="Nombre…" autocomplete="off" oninput="setReferido(this)"><input type="hidden" name="referido_id" id="ref-id"></div></div>
<div class="bloque"><h3>Perros</h3><table class="lineas" id="masc"><tr><th>Nombre</th><th>Raza</th><th>Cumple (día/mes)</th><th style="width:80px">Año</th><th></th></tr></table>
<button type="button" class="no-masc" onclick="agregarMascota()"><span class="no-masc-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7.2 5.2C8.6 4.4 10 4 11.5 4s2.9.4 4.3 1.2c.6 1.5.9 3.4.9 5.8 0 4-2.3 6.8-5.2 6.8S6.3 15 6.3 11c0-2.4.3-4.3.9-5.8z"/><path d="M7.2 5.2C5.4 5 3.6 6.4 3.4 9.6c-.1 1.5.5 2.5 1.6 2.6 1 .1 1.6-.9 1.6-2.2"/><path d="M15.8 5.2c1.8-.2 3.6 1.2 3.8 4.4"/><circle cx="9.6" cy="9.8" r=".55" fill="currentColor"/><circle cx="13.4" cy="9.8" r=".55" fill="currentColor"/><path d="M10.7 12.6h1.6l-.8 1z" fill="currentColor"/></svg><span class="no-masc-mas">+</span></span>Agregar mascota</button></div>
<div class="bloque"><h3>Nota del cliente (opcional)</h3><textarea name="nota" rows="2" placeholder="ej. Siempre se deja en vigilancia"></textarea>
<label class="chk" style="margin-top:8px"><input type="checkbox" name="nota_privada" value="1"> Solo la veo yo <span class="mini">(si no la marcas, logística también la ve al despachar)</span></label></div>
<p><button class="btn bloque">Guardar cliente</button></p></form>
<script>function setOrigen(sel){const r=sel.value.startsWith('Recomendación');document.getElementById('ref-w').hidden=!r;
 if(!r){document.getElementById('ref-in').value='';document.getElementById('ref-id').value='';}}
function setReferido(i){const o=[...document.getElementById('ref-cl').options].find(o=>o.value===i.value);document.getElementById('ref-id').value=o?o.dataset.id:'';}
function agregarMascota(){const tr=document.getElementById('masc').insertRow();tr.innerHTML=`<td><input name="mascota_nombre" placeholder="Toby"></td><td><input name="mascota_raza" list="razas" placeholder="elegir raza…" autocomplete="off"></td><td><input name="mascota_cumple" placeholder="25/09" inputmode="numeric"><input type="hidden" name="mascota_nacimiento" value=""><input type="hidden" name="mascota_peso" value=""></td><td><input name="mascota_anio" placeholder="2021" maxlength="4" inputmode="numeric"></td><td><button type="button" class="btn pel chico" onclick="this.closest('tr').remove()">×</button></td>`;}agregarMascota();</script>
<datalist id="ref-cl">{% for o in otros %}<option value="{{ o.nombre }}" data-id="{{ o.id }}">{% endfor %}</datalist>
